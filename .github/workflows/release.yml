name: Publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: ${{ !github.event.deleted }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust and fetch locked dependencies
        run: |
          rustup toolchain install 1.89.0 --profile minimal --target "$TARGET"
          cargo +1.89.0 fetch --locked --target "$TARGET"
      - name: Run offline tests (live tests stay ignored)
        run: cargo +1.89.0 test --locked --offline --all-targets --target "$TARGET"
      - name: Build and package
        run: |
          cargo +1.89.0 build --locked --offline --release --target "$TARGET" --target-dir target
          bash scripts/package-release.sh "$TARGET" "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: target/release-assets/fanqie-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 manifest
        working-directory: release-assets
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            ./*.tar.gz ./SHA256SUMS
