[package]
name = "fanqie"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A Claude Code-inspired terminal novel reader"
license = "MIT"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6"
encoding_rs = "0.8"
flate2 = "1"
md-5 = "0.10"
percent-encoding = "2"
rand = "0.8"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sm3 = "0.4"
textwrap = "0.16"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
